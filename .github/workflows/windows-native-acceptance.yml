name: Windows isolated native acceptance

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: paneforge-public-native-acceptance
  cancel-in-progress: false

jobs:
  native:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: windows-source-build-0.0.3-alpha.3
          run-id: 40452372948
          github-token: ${{ github.token }}
          path: built
      - name: Verify frozen source and build provenance
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $expected = '4feb8686e8165f3b7a1d3ae3cd2fd8ee3404420eeb14cce275f40005a42a1c85'
          if ($env:GITHUB_REPOSITORY -ne 'lihuabin1516-design/PaneForge-Releases') { throw 'Unexpected distribution repository' }
          $buildProvenance = Get-Content -Raw -LiteralPath built/build-input.json | ConvertFrom-Json
          if ($buildProvenance.sourceSha256 -ne $expected -or $buildProvenance.version -ne '0.0.3-alpha.3' -or $buildProvenance.runId -ne '40452372948') { throw 'Build provenance mismatch' }
          gh release download source-v0.0.3-alpha.3-4feb8686e816 --repo $env:GITHUB_REPOSITORY --pattern PaneForge_0.0.3-alpha.3_source.zip --dir input
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          if ((Get-FileHash input/PaneForge_0.0.3-alpha.3_source.zip).Hash -ne $expected) { throw 'Source hash mismatch' }
          Expand-Archive -LiteralPath input/PaneForge_0.0.3-alpha.3_source.zip -DestinationPath source
      - name: Install the existing build in isolation
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem -LiteralPath built -Filter PaneForge_0.0.3-alpha.3_x64-setup.exe -Recurse -File)
          if ($installers.Count -ne 1) { throw 'Expected one frozen installer' }
          if ((Get-FileHash -LiteralPath $installers[0].FullName).Hash -ne '842b8c2a7714a18f24200185bf163079b6de908697f53d2b739233f52a464d6b') { throw 'Installer hash mismatch' }
          $program = Join-Path $env:RUNNER_TEMP 'PaneForge-Native-Test'
          $install = Start-Process -FilePath $installers[0].FullName -ArgumentList @('/S', "/D=$program") -WindowStyle Hidden -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "Isolated installation failed: $($install.ExitCode)" }
          "NATIVE_TEST_PROGRAM=$program" >> $env:GITHUB_ENV
          Get-ChildItem -LiteralPath $program -File | Select-Object Name, Length, VersionInfo
          Get-ChildItem -LiteralPath 'HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients' -ErrorAction SilentlyContinue | Get-ItemProperty | Select-Object name, pv
          foreach ($base in @('HKCU:\SOFTWARE\Policies\Microsoft\Edge','HKLM:\SOFTWARE\Policies\Microsoft\Edge')) {
            Get-ItemProperty -LiteralPath $base -Name RemoteDebuggingAllowed,DeveloperToolsAvailability -ErrorAction SilentlyContinue | Select-Object PSPath,RemoteDebuggingAllowed,DeveloperToolsAvailability
            Get-ItemProperty -LiteralPath "$base\WebView2\AdditionalBrowserArguments" -ErrorAction SilentlyContinue
          }
      - name: Run the frozen native smoke
        working-directory: source
        shell: pwsh
        run: |
          npm install --prefix ../browser-tools --no-package-lock --ignore-scripts @playwright/test@1.58.2
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          # CDP starts before the initial Tauri target finishes its first navigation.
          # Wait for that exact target without replacing any feature assertion.
          @'
          import {chromium as actual, expect} from './browser-tools/node_modules/@playwright/test/index.mjs';
          export {expect};
          export const chromium = {
            async connectOverCDP(endpoint) {
              const browser = await actual.connectOverCDP(endpoint);
              try {
                await expect.poll(() => browser.contexts().flatMap(context => context.pages()).some(page => /tauri\.localhost|^tauri:/.test(page.url())), {timeout:30000,message:'initial native Tauri target navigation'}).toBe(true);
                return browser;
              } catch(error) {await browser.close();throw error;}
            }
          };
          '@ | Set-Content ../native-playwright-readiness.mjs -Encoding utf8
          # Chromium does not expose an accessible name on a native dd element.
          # Keep the same Session ID / Unassigned assertion, using its DOM label.
          @'
          import assert from 'node:assert/strict';
          import {readFileSync,writeFileSync} from 'node:fs';
          import {createHash} from 'node:crypto';
          const input=readFileSync('scripts/smoke-blueprint-desktop.mjs','utf8');
          const before="details.getByRole('definition', { name: 'Session ID' })";
          const after='details.locator(\'dd[aria-label="Session ID"]\')';
          assert.equal(input.split(before).length,2,'expected exactly one field locator adjustment');
          const output=input.replace(before,after);
          writeFileSync('scripts/smoke-blueprint-hosted.mjs',output,{flag:'wx'});
          console.log(JSON.stringify({nativeSmokeOriginalSha256:createHash('sha256').update(input).digest('hex'),nativeSmokeAdaptedSha256:createHash('sha256').update(output).digest('hex'),locatorAdjustment:{before,after}}));
          '@ | node --input-type=module
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Add-Type -TypeDefinition @'
          using System;
          using System.Text;
          using System.Runtime.InteropServices;
          public static class StandardUserAcceptance {
            [StructLayout(LayoutKind.Sequential)] struct STARTUPINFO {
              public int cb; public string reserved; public string desktop; public string title;
              public int x,y,xSize,ySize,xChars,yChars,fill,flags; public short show,reserved2;
              public IntPtr reservedPointer,input,output,error;
            }
            [StructLayout(LayoutKind.Sequential)] struct PROCESS_INFORMATION { public IntPtr process,thread; public uint pid,tid; }
            [StructLayout(LayoutKind.Sequential)] struct MANDATORY_LABEL { public IntPtr sid; public uint attributes; }
            [DllImport("advapi32.dll",SetLastError=true)] static extern bool SaferCreateLevel(uint scope,uint level,uint flags,out IntPtr handle,IntPtr reserved);
            [DllImport("advapi32.dll",SetLastError=true)] static extern bool SaferComputeTokenFromLevel(IntPtr level,IntPtr input,out IntPtr token,uint flags,IntPtr reserved);
            [DllImport("advapi32.dll")] static extern bool SaferCloseLevel(IntPtr level);
            [DllImport("advapi32.dll",CharSet=CharSet.Unicode,SetLastError=true)] static extern bool ConvertStringSidToSid(string value,out IntPtr sid);
            [DllImport("advapi32.dll",SetLastError=true)] static extern bool SetTokenInformation(IntPtr token,int kind,IntPtr data,int length);
            [DllImport("advapi32.dll",SetLastError=true)] static extern bool GetTokenInformation(IntPtr token,int kind,out int value,int size,out int needed);
            [DllImport("advapi32.dll",EntryPoint="GetTokenInformation",SetLastError=true)] static extern bool GetTokenHandle(IntPtr token,int kind,out IntPtr value,int size,out int needed);
            [DllImport("advapi32.dll",SetLastError=true)] static extern bool OpenProcessToken(IntPtr process,uint access,out IntPtr token);
            [DllImport("kernel32.dll")] static extern IntPtr GetCurrentProcess();
            [DllImport("advapi32.dll",EntryPoint="GetTokenInformation",SetLastError=true)] static extern bool GetTokenBuffer(IntPtr token,int kind,IntPtr value,int size,out int needed);
            [DllImport("advapi32.dll")] static extern IntPtr GetSidSubAuthorityCount(IntPtr sid);
            [DllImport("advapi32.dll")] static extern IntPtr GetSidSubAuthority(IntPtr sid,uint index);
            [DllImport("advapi32.dll",SetLastError=true)] static extern bool DuplicateToken(IntPtr token,int level,out IntPtr duplicate);
            [DllImport("advapi32.dll",SetLastError=true)] static extern bool CheckTokenMembership(IntPtr token,IntPtr sid,out bool member);
            [DllImport("advapi32.dll")] static extern int GetLengthSid(IntPtr sid);
            [DllImport("advapi32.dll",CharSet=CharSet.Unicode,SetLastError=true)] static extern bool CreateProcessAsUser(IntPtr token,string app,StringBuilder command,IntPtr processSecurity,IntPtr threadSecurity,bool inherit,uint flags,IntPtr environment,string cwd,ref STARTUPINFO startup,out PROCESS_INFORMATION process);
            [DllImport("kernel32.dll")] static extern IntPtr LocalFree(IntPtr pointer);
            [DllImport("kernel32.dll")] static extern bool CloseHandle(IntPtr handle);
            [DllImport("kernel32.dll")] static extern IntPtr GetStdHandle(int id);
            [DllImport("kernel32.dll")] static extern uint WaitForSingleObject(IntPtr handle,uint milliseconds);
            [DllImport("kernel32.dll")] static extern bool GetExitCodeProcess(IntPtr process,out uint code);
            static void Check(bool ok,string step) { if(!ok) throw new System.ComponentModel.Win32Exception(Marshal.GetLastWin32Error(),step); }
            public static int Run(string executable,string arguments,string cwd) {
              IntPtr original=IntPtr.Zero,token=IntPtr.Zero,level=IntPtr.Zero,sid=IntPtr.Zero,label=IntPtr.Zero,integrity=IntPtr.Zero,adminSid=IntPtr.Zero,impersonation=IntPtr.Zero;
              try {
                Check(OpenProcessToken(GetCurrentProcess(),0x000b,out original),"Open caller token");
                int elevated,kind,needed;
                Check(GetTokenInformation(original,20,out elevated,4,out needed),"Read caller elevation");
                Check(GetTokenInformation(original,18,out kind,4,out needed),"Read caller elevation type");
                Console.WriteLine("ACCEPTANCE_CALLER elevated="+elevated+" type="+kind);
                if(elevated==0) {token=original;original=IntPtr.Zero;}
                else if(kind==2) {Check(GetTokenHandle(original,19,out token,IntPtr.Size,out needed),"Read linked limited token");}
                else {
                  Check(SaferCreateLevel(1,0x20000,1,out level,IntPtr.Zero),"Create restricted normal-user level");
                  Check(SaferComputeTokenFromLevel(level,original,out token,0,IntPtr.Zero),"Restrict caller token");
                  Check(ConvertStringSidToSid("S-1-16-8192",out sid),"Create medium integrity SID");
                  int size=Marshal.SizeOf(typeof(MANDATORY_LABEL));label=Marshal.AllocHGlobal(size);
                  Marshal.StructureToPtr(new MANDATORY_LABEL {sid=sid,attributes=0x20},label,false);
                  Check(SetTokenInformation(token,25,label,size+GetLengthSid(sid)),"Set medium integrity");
                }
                Check(GetTokenInformation(token,20,out elevated,4,out needed),"Check limited token elevation");
                GetTokenBuffer(token,25,IntPtr.Zero,0,out needed);integrity=Marshal.AllocHGlobal(needed);
                Check(GetTokenBuffer(token,25,integrity,needed,out needed),"Read actual integrity");
                IntPtr integritySid=Marshal.ReadIntPtr(integrity);byte count=Marshal.ReadByte(GetSidSubAuthorityCount(integritySid));
                int rid=Marshal.ReadInt32(GetSidSubAuthority(integritySid,(uint)(count-1)));
                Check(ConvertStringSidToSid("S-1-5-32-544",out adminSid),"Create administrators SID");
                Check(DuplicateToken(token,2,out impersonation),"Duplicate membership token");
                bool admin;Check(CheckTokenMembership(impersonation,adminSid,out admin),"Read effective administrators membership");
                Console.WriteLine("ACCEPTANCE_TOKEN elevationMetadata="+elevated+" integrityRid="+rid+" effectiveAdmin="+admin);
                if(rid!=8192 || admin) throw new Exception("Refuse acceptance token with elevated integrity or enabled admin membership");
                var startup=new STARTUPINFO {cb=Marshal.SizeOf(typeof(STARTUPINFO)),flags=0x100,input=GetStdHandle(-10),output=GetStdHandle(-11),error=GetStdHandle(-12)};
                PROCESS_INFORMATION process;
                Check(CreateProcessAsUser(token,executable,new StringBuilder("\""+executable+"\" "+arguments),IntPtr.Zero,IntPtr.Zero,true,0x08000000,IntPtr.Zero,cwd,ref startup,out process),"Start ordinary-user native acceptance");
                try { WaitForSingleObject(process.process,0xffffffff);uint code;Check(GetExitCodeProcess(process.process,out code),"Read acceptance exit");return (int)code; }
                finally {CloseHandle(process.thread);CloseHandle(process.process);}
              } finally {if(impersonation!=IntPtr.Zero) CloseHandle(impersonation);if(adminSid!=IntPtr.Zero) LocalFree(adminSid);if(integrity!=IntPtr.Zero) Marshal.FreeHGlobal(integrity);if(label!=IntPtr.Zero) Marshal.FreeHGlobal(label);if(sid!=IntPtr.Zero) LocalFree(sid);if(level!=IntPtr.Zero) SaferCloseLevel(level);if(original!=IntPtr.Zero) CloseHandle(original);if(token!=IntPtr.Zero) CloseHandle(token);}
            }
          }
          '@
          $probe = Start-Job -ArgumentList $PWD.Path -ScriptBlock {
            param($sourcePath)
            Start-Sleep -Seconds 25
            Add-Type -TypeDefinition @'
          using System;
          using System.Text;
          using System.Runtime.InteropServices;
          public static class NativeEnvironmentProbe {
            [DllImport("kernel32.dll")] static extern IntPtr OpenProcess(uint access, bool inherit, int pid);
            [DllImport("kernel32.dll")] static extern bool CloseHandle(IntPtr handle);
            [DllImport("kernel32.dll")] static extern bool ReadProcessMemory(IntPtr handle, IntPtr address, byte[] bytes, int size, out IntPtr read);
            [DllImport("ntdll.dll")] static extern int NtQueryInformationProcess(IntPtr handle, int kind, byte[] info, int size, out int needed);
            static long Pointer(IntPtr handle, long address) {
              byte[] bytes = new byte[8]; IntPtr read;
              if (!ReadProcessMemory(handle, new IntPtr(address), bytes, bytes.Length, out read) || read.ToInt64()!=8) throw new Exception("Pointer read failed");
              return BitConverter.ToInt64(bytes,0);
            }
            public static string[] WebViewOnly(int pid) {
              IntPtr handle=OpenProcess(0x410,false,pid);
              if(handle==IntPtr.Zero) throw new Exception("Cannot read owned app");
              try {
                byte[] basic=new byte[48];int needed;
                if(NtQueryInformationProcess(handle,0,basic,basic.Length,out needed)!=0) throw new Exception("Process query failed");
                long parameters=Pointer(handle,BitConverter.ToInt64(basic,8)+0x20);
                long environment=Pointer(handle,parameters+0x80);
                var all=new StringBuilder();
                for(int offset=0;offset<262144;) {
                  int size=(int)Math.Min(4096-((environment+offset)%4096),262144-offset);
                  byte[] bytes=new byte[size];IntPtr read;
                  if(!ReadProcessMemory(handle,new IntPtr(environment+offset),bytes,size,out read)) throw new Exception("Environment read failed");
                  all.Append(Encoding.Unicode.GetString(bytes,0,(int)read));offset+=(int)read;
                  if(all.ToString().Contains("\0\0")) break;
                }
                return Array.FindAll(all.ToString().Split('\0'),value=>value.StartsWith("WEBVIEW2_",StringComparison.OrdinalIgnoreCase));
              } finally { CloseHandle(handle); }
            }
          }
          '@
            $processes = Get-CimInstance Win32_Process | Where-Object { $_.Name -in @('paneforge.exe','msedgewebview2.exe') }
            $summary = @($processes | ForEach-Object {
              @{ name=$_.Name;pid=$_.ProcessId;parent=$_.ParentProcessId;commandLinePresent=($null -ne $_.CommandLine);commandLineLength=$_.CommandLine.Length;commandLine=$_.CommandLine;executable=$_.ExecutablePath;version=(Get-Item -LiteralPath $_.ExecutablePath -ErrorAction SilentlyContinue).VersionInfo.FileVersion }
            })
            $profiles = @(Get-ChildItem -LiteralPath (Join-Path $sourcePath '../native-evidence') -Directory -Recurse -Filter webview -ErrorAction SilentlyContinue | ForEach-Object { @{path=$_.FullName;entries=@(Get-ChildItem -LiteralPath $_.FullName -Force | Select-Object -ExpandProperty Name)} })
            $appEnvironment = @($processes | Where-Object Name -eq 'paneforge.exe' | ForEach-Object { try { @{pid=$_.ProcessId;webviewEnvironment=[NativeEnvironmentProbe]::WebViewOnly([int]$_.ProcessId)} } catch { @{error=$_.Exception.Message} } })
            $ports = @(Get-NetTCPConnection -State Listen -ErrorAction SilentlyContinue | Where-Object { $_.OwningProcess -in $processes.ProcessId } | Select-Object LocalAddress, LocalPort, OwningProcess)
            $answers = @($ports | ForEach-Object {
              if ($_.LocalAddress -in @('127.0.0.1','0.0.0.0','::','::1')) {
                try { $response = Invoke-WebRequest -Uri "http://127.0.0.1:$($_.LocalPort)/json/version" -TimeoutSec 2; @{port=$_.LocalPort;status=$response.StatusCode;body=$response.Content.Substring(0,[Math]::Min(400,$response.Content.Length))} }
                catch { @{port=$_.LocalPort;error=$_.Exception.Message} }
              }
            })
            $windowInfo = @()
            try {
              Add-Type -AssemblyName UIAutomationClient,UIAutomationTypes,System.Windows.Forms,System.Drawing
              foreach ($item in $processes | Where-Object Name -eq 'paneforge.exe') {
                $condition = [System.Windows.Automation.PropertyCondition]::new([System.Windows.Automation.AutomationElement]::ProcessIdProperty, [int]$item.ProcessId)
                $window = [System.Windows.Automation.AutomationElement]::RootElement.FindFirst([System.Windows.Automation.TreeScope]::Children,$condition)
                if ($null -ne $window) {
                  $windowInfo += @{name=$window.Current.Name;controls=@($window.FindAll([System.Windows.Automation.TreeScope]::Descendants,[System.Windows.Automation.Condition]::TrueCondition) | Select-Object -First 100 | ForEach-Object { $_.Current.Name })}
                }
              }
              $bounds = [System.Windows.Forms.SystemInformation]::VirtualScreen
              $bitmap = [System.Drawing.Bitmap]::new($bounds.Width,$bounds.Height)
              $graphics = [System.Drawing.Graphics]::FromImage($bitmap)
              $graphics.CopyFromScreen($bounds.Left,$bounds.Top,0,0,$bounds.Size)
              $bitmap.Save((Join-Path $sourcePath '../native-desktop.png'))
              $graphics.Dispose(); $bitmap.Dispose()
            } catch { $windowInfo += @{error=$_.Exception.Message} }
            @{processes=$summary;appEnvironment=$appEnvironment;profiles=$profiles;ports=$ports;http=$answers;windows=$windowInfo} | ConvertTo-Json -Depth 6
          }
          $nativeArguments = 'scripts/smoke-blueprint-hosted.mjs ../native-playwright-readiness.mjs "' + $env:NATIVE_TEST_PROGRAM + '" ../native-evidence'
          $smokeExit = [StandardUserAcceptance]::Run((Get-Command node).Source,$nativeArguments,$PWD.Path)
          $probe | Wait-Job -Timeout 35 | Receive-Job | Set-Content ../startup-probe.json
          exit $smokeExit
      - name: Collect isolated startup diagnostics
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path diagnostics -Force | Out-Null
          function Protect-DiagnosticText([string]$value) {
            return ($value -replace '(?i)(bearer\s+)[A-Za-z0-9._~+/-]+', '$1[redacted]' -replace '(?i)((?:token|password|secret)["\s:=]+)[^\s,"}]+', '$1[redacted]')
          }
          $files = Get-ChildItem -LiteralPath native-evidence -Filter *.log -Recurse -File -ErrorAction SilentlyContinue
          $index = 0
          foreach ($file in $files) {
            $text = Get-Content -Raw -LiteralPath $file.FullName
            $text = Protect-DiagnosticText $text
            $text | Set-Content -LiteralPath "diagnostics/startup-$index.log" -Encoding utf8
            $index++
          }
          Get-Process paneforge,msedgewebview2 -ErrorAction SilentlyContinue | Select-Object ProcessName, Id, Path, MainWindowTitle | ConvertTo-Json | Set-Content diagnostics/processes.json
          $events = Get-WinEvent -FilterHashtable @{LogName='Application';StartTime=(Get-Date).AddMinutes(-15);Level=2} -MaxEvents 10 -ErrorAction SilentlyContinue | Select-Object ProviderName, Id, Message | ConvertTo-Json
          (Protect-DiagnosticText $events) | Set-Content diagnostics/application-errors.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-acceptance-alpha3
          retention-days: 1
          if-no-files-found: error
          path: |
            native-evidence/**/result.json
            native-evidence/**/*.png
            diagnostics/*
            startup-probe.json
            native-desktop.png
