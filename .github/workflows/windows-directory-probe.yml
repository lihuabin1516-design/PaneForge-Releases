name: Windows directory API diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  directory-api:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - name: Observe same-object directory reopen behavior
        shell: pwsh
        run: |
          # Independent API experiment only; this is not product acceptance.
          Add-Type -TypeDefinition @'
          using System;
          using System.ComponentModel;
          using System.IO;
          using System.Runtime.InteropServices;
          using Microsoft.Win32.SafeHandles;
          public static class DirectoryApiProbe {
            [DllImport("kernel32.dll", CharSet=CharSet.Unicode, SetLastError=true)]
            static extern SafeFileHandle CreateFileW(string path, uint access, uint share, IntPtr security, uint disposition, uint flags, IntPtr template);
            [DllImport("kernel32.dll", SetLastError=true)]
            static extern SafeFileHandle ReOpenFile(SafeFileHandle original, uint access, uint share, uint flags);
            [DllImport("kernel32.dll", SetLastError=true)]
            static extern bool GetFileInformationByHandle(SafeFileHandle handle, out FileInfo info);
            [DllImport("kernel32.dll", SetLastError=true)]
            static extern bool DuplicateHandle(IntPtr sourceProcess, SafeFileHandle source, IntPtr targetProcess, out SafeFileHandle target, uint access, bool inherit, uint options);
            [DllImport("ntdll.dll")]
            static extern int NtCreateFile(out IntPtr handle, uint access, ref ObjectAttributes attributes, out IoStatus status, IntPtr allocation, uint fileAttributes, uint share, uint disposition, uint options, IntPtr ea, uint eaLength);
            [StructLayout(LayoutKind.Sequential)]
            struct UnicodeName { public ushort Length, MaximumLength; public IntPtr Buffer; }
            [StructLayout(LayoutKind.Sequential)]
            struct ObjectAttributes { public uint Length; public IntPtr Root, Name; public uint Attributes; public IntPtr Security, Qos; }
            [StructLayout(LayoutKind.Sequential)]
            struct IoStatus { public IntPtr Status; public UIntPtr Information; }
            [StructLayout(LayoutKind.Sequential)]
            struct FileInfo {
              public uint Attributes;
              public System.Runtime.InteropServices.ComTypes.FILETIME Created, Accessed, Written;
              public uint Volume, SizeHigh, SizeLow, Links, IndexHigh, IndexLow;
            }
            static SafeFileHandle RelativeCreate(SafeFileHandle parent, string name, bool directory) {
              IntPtr buffer = Marshal.StringToHGlobalUni(name);
              IntPtr unicode = Marshal.AllocHGlobal(Marshal.SizeOf<UnicodeName>());
              try {
                var text = new UnicodeName { Length = checked((ushort)(name.Length * 2)), MaximumLength = checked((ushort)(name.Length * 2)), Buffer = buffer };
                Marshal.StructureToPtr(text, unicode, false);
                var attributes = new ObjectAttributes { Length = (uint)Marshal.SizeOf<ObjectAttributes>(), Root = parent.DangerousGetHandle(), Name = unicode, Attributes = 0x1040 };
                int result = NtCreateFile(out var raw, 0x12019f, ref attributes, out var status, IntPtr.Zero, 0, 3, 2, 0x00200020u | (directory ? 1u : 0u), IntPtr.Zero, 0);
                GC.KeepAlive(parent);
                if (result < 0) throw new Exception(String.Format("NtCreateFile {0}: NTSTATUS=0x{1:x8}", directory ? "directory" : "file", result));
                var handle = new SafeFileHandle(raw, true);
                if (handle.IsInvalid) { handle.Dispose(); throw new Exception("NtCreateFile returned invalid handle"); }
                return handle;
              } finally { Marshal.FreeHGlobal(unicode); Marshal.FreeHGlobal(buffer); }
            }
            static void CheckDuplicate(SafeFileHandle original, FileInfo expected) {
              if (!DuplicateHandle(new IntPtr(-1), original, new IntPtr(-1), out var duplicate, 0, false, 2)) throw new Win32Exception(Marshal.GetLastWin32Error(), "DuplicateHandle");
              using (duplicate) {
                if (!GetFileInformationByHandle(duplicate, out var actual)) throw new Win32Exception(Marshal.GetLastWin32Error(), "duplicate identity");
                if (expected.Volume != actual.Volume || expected.IndexHigh != actual.IndexHigh || expected.IndexLow != actual.IndexLow) throw new Exception("Duplicate identity changed");
                using (var childDirectory = RelativeCreate(duplicate, "owned-child", true)) {
                  using (var childFile = RelativeCreate(childDirectory, "input.cjs", false)) {
                    using (var stream = new FileStream(childFile, FileAccess.ReadWrite)) {
                      byte[] bytes = System.Text.Encoding.ASCII.GetBytes("const value = 42;\n");
                      stream.Write(bytes, 0, bytes.Length);
                      stream.Flush(true);
                      stream.Position = 0;
                      byte[] actualBytes = new byte[bytes.Length];
                      stream.ReadExactly(actualBytes);
                      if (!bytes.AsSpan().SequenceEqual(actualBytes)) throw new Exception("Readback mismatch");
                    }
                  }
                }
                Console.WriteLine("DUPLICATE_READONLY_ROOT_SAME_OBJECT_CREATE_FLUSH_READBACK_OK");
              }
            }
            public static void Run(string root) {
              using (var original = CreateFileW(root, 0x120089, 3, IntPtr.Zero, 3, 0x02200000, IntPtr.Zero)) {
                if (original.IsInvalid) throw new Win32Exception(Marshal.GetLastWin32Error(), "CreateFileW root");
                if (!GetFileInformationByHandle(original, out var before)) throw new Win32Exception(Marshal.GetLastWin32Error(), "original identity");
                Console.WriteLine("ROOT_OPEN_OK identity={0}:{1}:{2}", before.Volume, before.IndexHigh, before.IndexLow);
                foreach (uint access in new uint[] { 0x120089, 0x12019f, 0x80000000, 0xc0000000 }) {
                  foreach (uint flags in new uint[] { 0x02000000, 0x02200000 }) {
                    using (var reopened = ReOpenFile(original, access, 3, flags)) {
                      int error = Marshal.GetLastWin32Error();
                      if (reopened.IsInvalid) {
                        Console.WriteLine("REOPEN access=0x{0:x8} flags=0x{1:x8} error={2} message={3}", access, flags, error, new Win32Exception(error).Message);
                        continue;
                      }
                      if (!GetFileInformationByHandle(reopened, out var after)) throw new Win32Exception(Marshal.GetLastWin32Error(), "reopened identity");
                      if (before.Volume != after.Volume || before.IndexHigh != after.IndexHigh || before.IndexLow != after.IndexLow) throw new Exception("Directory identity changed");
                      Console.WriteLine("REOPEN access=0x{0:x8} flags=0x{1:x8} SAME_OBJECT_OK", access, flags);
                    }
                  }
                }
                CheckDuplicate(original, before);
              }
              Console.WriteLine("DIRECTORY_API_PROBE_COMPLETED");
            }
          }
          '@
          $probeRoot = Join-Path $env:RUNNER_TEMP ('paneforge-directory-api-' + [Guid]::NewGuid().ToString('N'))
          New-Item -ItemType Directory -Path $probeRoot -ErrorAction Stop | Out-Null
          [DirectoryApiProbe]::Run($probeRoot)
